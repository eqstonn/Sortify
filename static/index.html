<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sortify Scan</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f7f4; color: #1d2b1f; text-align: center; }
    h1 { color: #2e7d32; margin: 8px 0 16px; }
    video, img { width: 100%; max-width: 480px; border-radius: 12px; background: #000; }
    button { font-size: 18px; padding: 14px 28px; margin: 12px 6px; border: none; border-radius: 999px; background: #2e7d32; color: #fff; }
    button:disabled { background: #9e9e9e; }
    #result { max-width: 480px; margin: 12px auto; padding: 16px; border-radius: 12px; background: #fff; text-align: left; display: none; }
    .yes { color: #2e7d32; font-weight: bold; }
    .no { color: #c62828; font-weight: bold; }
    #fallback { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Sortify</h1>

  <video id="video" autoplay playsinline muted></video>
  <img id="preview" style="display:none" alt="captured photo" />
  <canvas id="canvas" style="display:none"></canvas>

  <div>
    <button id="snap">Scan item</button>
    <button id="retake" style="display:none">Retake</button>
  </div>

  <!-- If the live camera doesn't work, this opens the phone camera / file picker instead -->
  <div id="fallback">
    <label>or upload a photo: <input type="file" id="file" accept="image/*" capture="environment" /></label>
  </div>

  <div id="result"></div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const snapBtn = document.getElementById("snap");
    const retakeBtn = document.getElementById("retake");
    const resultBox = document.getElementById("result");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false,
        });
        video.srcObject = stream;
      } catch (err) {
        video.style.display = "none";
        snapBtn.style.display = "none";
        showMessage("Camera not available (" + err.name + "). Use the upload button instead. On a phone, the page must be opened over https, e.g. through ngrok.");
      }
    }

    function showMessage(text) {
      resultBox.style.display = "block";
      resultBox.textContent = text;
    }

    function showResult(r) {
      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <h2>${r.item ?? "Unknown"}</h2>
        <p class="${r.recyclable ? "yes" : "no"}">${r.recyclable ? "Recyclable" : "Not recyclable"}</p>
        <p><b>Bin:</b> ${r.bin ?? "-"}</p>
        <p><b>Material:</b> ${r.material ?? "-"}</p>
        <p>${r.instructions ?? ""}</p>
        <p><small>Confidence: ${r.confidence ?? "-"}</small></p>`;
    }

    async function send(blob) {
      snapBtn.disabled = true;
      showMessage("Analyzing...");
      const form = new FormData();
      form.append("image", blob, "scan.jpg");
      try {
        const res = await fetch("/classify", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        showResult(data);
      } catch (err) {
        showMessage("Error: " + err.message);
      } finally {
        snapBtn.disabled = false;
      }
    }

    snapBtn.onclick = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      preview.src = canvas.toDataURL("image/jpeg", 0.85);
      preview.style.display = "inline";
      video.style.display = "none";
      snapBtn.style.display = "none";
      retakeBtn.style.display = "inline";
      canvas.toBlob(send, "image/jpeg", 0.85);
    };

    retakeBtn.onclick = () => {
      preview.style.display = "none";
      video.style.display = "inline";
      snapBtn.style.display = "inline";
      retakeBtn.style.display = "none";
      resultBox.style.display = "none";
    };

    document.getElementById("file").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "inline";
      video.style.display = "none";
      send(file);
    };

    startCamera();
  </script>
</body>
</html>
